; PlatformIO / Arduino 构建配置 — 音乐播放器 (ES3C28P: ESP32-S3 N16R8)
; 板子: ESP32-S3 + ILI9341 320x240 横屏 + FT6336 触摸 + I2S
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 源码与 .ino 同在根目录（Arduino IDE 2.x 与 PlatformIO 通用结构）。
; 入口 setup()/loop() 定义在 main.cpp（PlatformIO 编译它）；
; .ino 仅 #include "main.cpp" 供 Arduino IDE 使用，PlatformIO 不应再编 .ino。
; 注意：不能设 src_dir = src，否则 .ino 不会被识别、setup()/loop() 链接失败。

; 显式只编译 .cpp/.c，排除 .ino（避免 setup/loop 与 main.cpp 重复定义）
build_src_filter = +<*.cpp> +<*.c> +<*.h> -<*.ino>

; 使用 freenove 板级定义（含 16MB flash / 8MB PSRAM）
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_qspi

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    lovyan03/LovyanGFX@^1.1.10

; 中文字库较大，放到 flash（PROGMEM）
build_unflags =
    -Werror
