name: Build ESP-IDF

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ESP-IDF firmware (LVGL + full CN font)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CN font tooling
        run: |
          apt-get update && apt-get install -y fonts-noto-cjk nodejs npm
          npm install -g lv_font_conv

      - name: Generate full Chinese font
        run: |
          . $IDF_PATH/export.sh
          python main/gen_fonts.py

      - name: Re-resolve dependencies (clear dirty managed_components)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          rm -rf managed_components dependencies.lock build
          idf.py set-target esp32s3
          idf.py build

      - name: Debug: dump lvgl package layout
        if: always()
        shell: bash
        run: |
          echo "=== find lvgl.h in managed_components ==="
          find managed_components/lvgl__lvgl -name 'lvgl.h' 2>/dev/null || echo "NO lvgl.h FOUND"
          echo "=== top dirs of lvgl__lvgl ==="
          ls -la managed_components/lvgl__lvgl 2>/dev/null || echo "NO lvgl__lvgl dir"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
          if-no-files-found: warn
